name: CI

# Safety net only: lint, type-check, tests, build and a critical-advisory gate. No secrets, no deployment.
# (deploy.yml is unchanged and still deploys on push to main.)
# Lint fails on errors only; existing warnings are tracked in docs/SECURITY-BASELINE.md.

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Tests
        run: npm test

      - name: Dependency audit (fails on critical advisories only)
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
