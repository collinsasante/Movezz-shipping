name: CI

# Safety net only: lint, type-check, tests, build and a critical-advisory gate. No secrets, no deployment.
# (deploy.yml is unchanged and still deploys on push to main.)
# Lint fails on errors only; existing warnings are tracked in docs/SECURITY-BASELINE.md.

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway PostgreSQL 16 for the database integration tests (no secrets; trust auth on the job network only).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Tests
        run: npm test

      - name: Database integration tests (PostgreSQL 16)
        run: npm run test:db
        env:
          MOVEZZ_TEST_PG_URL: postgres://postgres@127.0.0.1:54329/postgres

      - name: Dependency audit (fails on critical advisories only)
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
